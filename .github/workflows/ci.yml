# CI for kana-quiz.
#
# `next build` is the point of this file. tsc and the unit suite have shipped a
# green, type-clean tree that still would not boot — a route conflict is a build
# error, not a type error, and no unit test mounts a route. So the build is the
# only gate on the boot class, and it runs on every push and PR alongside the
# checks that were already green when that conflict shipped.
name: Checks and content seed

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Checks for an obsolete commit may stop as soon as a newer commit arrives.
    # This is job-scoped so it cannot interrupt the stateful seed job below.
    concurrency:
      group: ci-check-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 24, from .nvmrc — the unit harness needs Node's TS type-stripping and
          # test runner, which the repo's default node (v14) does not have.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run type-check

      # `eslint src`, not the bare `lint` script: the script lints the repo root,
      # which trips react-hooks/rules-of-hooks on Playwright's page.use() in
      # e2e/helpers (a false positive, and out of scope for this app's lint gate).
      # `src` is the tree that is kept error-clean.
      - name: Lint
        run: pnpm exec eslint src

      - name: Unit tests
        run: pnpm test

      # The corpus is a COMMITTED artifact, so a bad example ships the moment it
      # lands. This is the confound audit in report-only mode: it exits 1 if
      # grammar-corpus.json holds a sentence that does not demonstrate the pattern
      # it is filed under (see src/data/grammar/corpus-audit.ts for the seven
      # signatures that collide). Nothing else in CI reads the data for meaning,
      # so without this a regenerate or a hand-edit reintroduces examples that
      # teach the wrong thing and no gate notices.
      - name: Corpus audit
        run: pnpm run audit-corpus:check

      # assembly-corpus.json (the "build a sentence from pieces" word bank) is
      # DERIVED from grammar-corpus.json by a separate script (scripts/ingest/
      # assembly.py) a human has to remember to re-run. Nothing enforced that
      # until SAK-274, where two additive grammar-corpus updates shipped without
      # a regeneration and the derived set silently went stale. This does not
      # re-run the tokenizer (that needs fugashi/unidic-lite, which CI does not
      # install) — it only checks the committed meta file's recorded input size
      # still matches grammar-corpus.json, which is enough to catch exactly this
      # class of drift.
      - name: Assembly corpus freshness
        run: pnpm run check-assembly-freshness

      # src/data/generated/en-synonyms.json is a COMMITTED, mostly-generated
      # artifact (see scripts/build-en-synonyms.mjs) that degrades gracefully
      # when stale — a missing key just falls back to exact-match grading, so
      # nothing else here would ever notice it silently drifting further out
      # of sync with new content (SAK-272: it reached 42% missing, unnoticed,
      # before this gate existed). This fails the build the moment a merged
      # PR adds gloss keys the pool has never even been asked about, so
      # catching up is a small, immediate diff instead of a periodic
      # rediscovery.
      - name: Synonym pool coverage
        run: pnpm run audit-en-synonyms:check

      # The gate the other three cannot be: a route conflict, a bad import, an
      # invalid config — none is a type or lint or unit-test failure, and all of
      # them are a failed build.
      - name: Build
        run: pnpm run build

      # SAK-228: bundle-size regression gate. Reads the client JS each route's
      # own manifest references straight out of the `.next` this Build step
      # just produced, and fails if any route exceeds its budget (see
      # scripts/route_sizes.mjs for how each budget was picked). Runs on every
      # push and PR, not only main — the whole point is to catch a route
      # ballooning (the 27MB bundle bug this ticket is named for) BEFORE it
      # merges, not after.
      - name: Bundle size budget
        run: pnpm run check-route-sizes
